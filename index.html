<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Tools</title>
<style>
:root{--bg:#f4ecd8; --panel:#fffaf0; --ink:#2b2118; --muted:#6b5d4f; --line:#c9b78f; --accent:#7a1f1f;}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1712; --panel:#241d16; --ink:#ecdfc4; --muted:#a4917a; --line:#4a3d2c; --accent:#c1553d;}
}
body{margin:0; padding:24px 16px; background:var(--bg); color:var(--ink); font-family:Georgia,'Times New Roman',serif; font-size:16px;}
main{max-width:560px; margin:0 auto;}
h1{font-size:1.4em; margin:0 0 4px;}
p{color:var(--muted); margin:0 0 16px;}
a.card{display:block; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; color:inherit; text-decoration:none;}
a.card b{color:var(--accent);}
a.card small{display:block; color:var(--muted); margin-top:2px;}
</style>
</head>
<body>
<main>
  <h1>RPG Tools</h1>
  <p>Fichas de personagem interativas. Abra no Safari e use "Adicionar à Tela de Início" para ter a ficha como um app.</p>
  <a class="card" href="sheets/vaelun/"><b>Vaelun</b><small>Changeling · Bruxo (Lâmina Maldita) · Nível 3 · Charlatão</small></a>
  <a class="card" href="sheets/sokomo/"><b>Sokomo Kudiome</b><small>Humano · Bardo (Colégio do Conhecimento) · Nível 3 · Nobre</small></a>
</main>
</body>
</html>
